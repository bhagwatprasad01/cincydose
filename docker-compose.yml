# CincyDose at cincydose.org
#   1. cp .env.example .env   and fill it in
#   2. docker compose up -d
# Caddy obtains and renews HTTPS certificates automatically.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - cincydose-data:/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  cincydose-data:
  caddy-data:
  caddy-config:
